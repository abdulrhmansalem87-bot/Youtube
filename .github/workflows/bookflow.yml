name: BookFlow validation and renderer contract

on:
  push:
    branches: [main, feat/book-page-video-pipeline]
    paths:
      - "bookflow/**"
      - "scripts/bookflow_validate.py"
      - "scripts/bookflow_render.py"
      - "scripts/bookflow_youtube_upload.py"
      - "tests/test_bookflow_contract.py"
      - ".github/workflows/bookflow.yml"
      - "BOOKFLOW_PRODUCTION_METHOD.md"
  pull_request:
    branches: [main]
    paths:
      - "bookflow/**"
      - "scripts/bookflow_validate.py"
      - "scripts/bookflow_render.py"
      - "tests/test_bookflow_contract.py"
      - ".github/workflows/bookflow.yml"
      - "BOOKFLOW_PRODUCTION_METHOD.md"
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to a BookFlow JSON plan in this repository"
        required: true
        default: "bookflow/examples/sample_short.json"
        type: string

permissions:
  contents: write

concurrency:
  group: bookflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer fonts and verify system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          command -v ffmpeg
          command -v ffprobe
          test -n "$(find /usr/share/fonts -type f -name 'DejaVuSans-Bold.ttf' -print -quit)"
      - name: Install Pillow and verify Arabic shaping
        run: |
          pip install Pillow==11.0.0 google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow must support RAQM for correctly shaped Arabic text'"
      - name: Validate selected plan
        run: python scripts/bookflow_validate.py "$PLAN_PATH"
        env:
          PLAN_PATH: ${{ github.event.inputs.plan_path || 'bookflow/examples/sample_short.json' }}
      - name: Validate five-minute sample too
        run: python scripts/bookflow_validate.py bookflow/examples/sample_long.json
      - name: Validate Episode 1 production plan
        run: python scripts/bookflow_validate.py bookflow/episodes/episode-01-psychology-of-money.json
      - name: Validate Episode 1 companion Short
        run: python scripts/bookflow_validate.py bookflow/episodes/episode-01-companion-short.json
      - name: Run BookFlow contract tests
        run: python -m unittest discover -s tests -p "test_bookflow_contract.py" -v
      - name: Render Episode 1 long video
        run: python scripts/bookflow_render.py bookflow/episodes/episode-01-psychology-of-money.json --output output/bookflow/episode-01-long.mp4 --cache output/bookflow/cache-long
      - name: Enforce exact five-minute long-video duration
        run: |
          ffmpeg -y -i output/bookflow/episode-01-long.mp4 \
            -vf "tpad=stop_mode=clone:stop_duration=2,trim=duration=300,setpts=PTS-STARTPTS" \
            -t 300 -an -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p \
            -movflags +faststart output/bookflow/episode-01-long-exact.mp4
          mv output/bookflow/episode-01-long-exact.mp4 output/bookflow/episode-01-long.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/bookflow/episode-01-long.mp4)
          python -c "import sys; d=float(sys.argv[1]); assert d >= 300.0, f'Long video is shorter than five minutes: {d}'" "$DURATION"
      - name: Render Episode 1 companion Short
        run: python scripts/bookflow_render.py bookflow/episodes/episode-01-companion-short.json --output output/bookflow/episode-01-short.mp4 --cache output/bookflow/cache-short
      - name: Verify review files
        run: |
          test -s output/bookflow/episode-01-long.mp4
          test -s output/bookflow/episode-01-short.mp4
          ls -lh output/bookflow/*.mp4
          sha256sum output/bookflow/*.mp4
      - name: Create private draft release with review videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "bookflow-review-${GITHUB_RUN_NUMBER}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "BookFlow Episode 01 — Private Review (Run ${GITHUB_RUN_NUMBER})" \
            --notes "Private review assets. YouTube upload is owner-authorized and remains PRIVATE." \
            output/bookflow/episode-01-long.mp4 \
            output/bookflow/episode-01-short.mp4

      - name: Upload BookFlow videos to WealthRadar as PRIVATE
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-upload]')) || (github.event_name == 'workflow_dispatch' && inputs.upload_private)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_TITLE: WealthRadar
        run: python scripts/bookflow_youtube_upload.py
