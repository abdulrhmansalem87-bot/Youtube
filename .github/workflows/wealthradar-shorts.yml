name: WealthRadar Shorts (isolated experiment only)

on:
  # This is not the approved production route. One-Short experiments require explicit opt-in.
  workflow_dispatch:
    inputs:
      isolated_short_experiment:
        description: "Run one isolated Short only (not the standard main-video + companion-Shorts production)"
        required: true
        type: boolean
        default: false
      owner_approved:
        description: "I explicitly authorize this one PRIVATE Short after automated checks pass"
        required: true
        type: boolean
        default: false
      visual_qa_approved:
        description: "I reviewed the prior phone preview and approve this PRIVATE test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wealthradar-shorts-private-staging
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ inputs.isolated_short_experiment == true && inputs.owner_approved == true && inputs.visual_qa_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run one owner-approved PRIVATE Short
        env:
          NEWSFLOW_MAX_STORIES: "1"
          NEWSFLOW_LOOKBACK_HOURS: "12"
          NEWSFLOW_FACT_CHECK_ENABLED: "true"
          NEWSFLOW_ALLOW_ISOLATED_SHORT_EXPERIMENT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSFLOW_STRICT_FRESHNESS: "false"
          NEWSFLOW_MAIN_VIDEO_PORTRAIT: "false"
          NEWSFLOW_UPLOAD_SINGLE_LONG: "false"
          NEWSFLOW_PRIVATE_STAGING: "true"
          NEWSFLOW_EDITORIAL_APPROVED: "false"
          NEWSFLOW_OWNER_APPROVED: "true"
          NEWSFLOW_VISUAL_QA_APPROVED: "true"
          YOUTUBE_UPLOAD_ENABLED: "true"
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m newsflow --private-staging --shorts-only --max-stories 1
      - name: Verify rendered Short exists
        if: always()
        run: |
          if [ -s output/bulletin/shorts/short-1.mp4 ]; then
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/bulletin/shorts/short-1.mp4
            echo "[SHORT_ARTIFACT_VERIFIED] output/bulletin/shorts/short-1.mp4"
          else
            echo "::error::No rendered Short was produced."
            exit 1
          fi
      - name: Save Short and editorial evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wealthradar-short-review-${{ github.run_number }}
          path: |
            output/bulletin/shorts/
            output/editorial_review.json
            output/stories.json
          if-no-files-found: warn
          retention-days: 14
