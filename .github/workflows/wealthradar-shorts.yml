name: WealthRadar Shorts

on:
  # Manual one-Short staging only. Daily scheduled production remains in NewsFlow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealthradar-shorts-private-staging
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Render one Short with the cloned WealthRadar voice and upload privately
        env:
          NEWSFLOW_MAX_STORIES: "1"
          NEWSFLOW_LOOKBACK_HOURS: "12"
          NEWSFLOW_STRICT_FRESHNESS: "false"
          NEWSFLOW_MAIN_VIDEO_PORTRAIT: "false"
          NEWSFLOW_UPLOAD_SINGLE_LONG: "false"
          NEWSFLOW_PRIVATE_STAGING: "true"
          NEWSFLOW_EDITORIAL_APPROVED: "false"
          NEWSFLOW_VISUAL_QA_APPROVED: "false"
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ secrets.FISH_AUDIO_REFERENCE_ID }}
          FISH_AUDIO_MODEL: s2.1-pro-free
          YOUTUBE_UPLOAD_ENABLED: "true"
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m newsflow --private-staging --shorts-only --max-stories 1
      - name: Verify rendered Short exists
        if: always()
        run: |
          if [ -s output/bulletin/shorts/short-1.mp4 ]; then
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/bulletin/shorts/short-1.mp4
            echo "[SHORT_ARTIFACT_VERIFIED] output/bulletin/shorts/short-1.mp4"
          else
            echo "::error::No rendered Short was produced."
            exit 1
          fi
      - name: Save Short and editorial evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wealthradar-short-review-${{ github.run_number }}
          path: |
            output/bulletin/shorts/
            output/editorial_review.json
            output/stories.json
          if-no-files-found: warn
          retention-days: 14
