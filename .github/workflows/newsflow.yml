name: NewsFlow pipeline

on:
  workflow_dispatch:
schedule 
  - cron: : 6 * * * *
permissions:
  contents: read

concurrency:
  group: newsflow-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run NewsFlow
        env:
          NEWSFLOW_MAX_STORIES: "5"
          NEWSFLOW_TTS_VOICE: ar-EG-SalmaNeural
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED || 'false' }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m newsflow --dry-run
          else
            python -m newsflow
          fi
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsflow-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
