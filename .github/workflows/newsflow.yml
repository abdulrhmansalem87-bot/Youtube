name: NewsFlow pipeline
# One-time private staging trigger: independent fact-check, then owner-review upload only.

on:
  push:
    branches: [main]
    paths:
      - "newsflow/**"
      - "config/sources.yml"
      - ".github/workflows/newsflow.yml"
      - "tests/**"
      - "content/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "newsflow/**"
      - "config/sources.yml"
      - ".github/workflows/newsflow.yml"
      - "tests/**"
      - "content/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and validate stories only; disable only for an explicitly approved private test"
        required: false
        type: boolean
        default: true
      private_test:
        description: "Upload one long video as PRIVATE (manual run only)"
        required: false
        type: boolean
        default: false
      editorial_approved:
        description: "I reviewed the generated editorial report and approve private upload"
        required: false
        type: boolean
        default: false
      visual_qa_approved:
        description: "I reviewed the actual phone preview from a prior run and approve a PRIVATE test only"
        required: false
        type: boolean
        default: false
  schedule:
    # Cairo winter (UTC+2): 3 PM, 7 PM, 10 PM
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    # Cairo summer (UTC+3): 3 PM, 7 PM, 10 PM
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  # Keep production schedule/manual runs independent from push validation and PR previews.
  group: ${{ github.event_name == 'pull_request' && format('newsflow-pr-{0}', github.event.pull_request.number) || (github.event_name == 'schedule' && 'newsflow-schedule') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]') && 'newsflow-schedule') || (github.event_name == 'workflow_dispatch' && 'newsflow-manual') || format('newsflow-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q newsflow
      - name: Run editorial and render tests
        run: python -m unittest discover -s tests -v
      - name: Resolve Cairo schedule slot
        id: cairo_schedule
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: python -m newsflow.schedule "$EVENT_SCHEDULE" >> "$GITHUB_OUTPUT"
      - name: Report Cairo schedule decision
        if: always() && github.event_name == 'schedule'
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          RUN_ENABLED: ${{ steps.cairo_schedule.outputs.run || 'false' }}
          TARGET_LOCAL_TIME: ${{ steps.cairo_schedule.outputs.target_local_time || 'n/a' }}
          CAIRO_LOCAL_TIME: ${{ steps.cairo_schedule.outputs.cairo_local_time || 'n/a' }}
          CAIRO_UTC_OFFSET: ${{ steps.cairo_schedule.outputs.cairo_utc_offset || 'n/a' }}
          SCHEDULE_REASON: ${{ steps.cairo_schedule.outputs.reason || 'schedule resolver did not return a reason' }}
        run: |
          {
            echo "## WealthRadar Cairo schedule gate"
            echo "- UTC cron: $EVENT_SCHEDULE"
            echo "- Cairo time at gate: $CAIRO_LOCAL_TIME ($CAIRO_UTC_OFFSET)"
            echo "- Target Cairo slot: $TARGET_LOCAL_TIME"
            echo "- Run enabled: $RUN_ENABLED"
            echo "- Decision: $SCHEDULE_REASON"
            echo "- Scheduled mode: render and upload long + Shorts as PRIVATE owner-review drafts; never public automatically"
            echo "- Story repeat guard: 8-hour history cache"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore recent scheduled story history
        if: (github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))
        uses: actions/cache/restore@v6.1.0
        with:
          path: output/history
          key: wealthradar-story-history-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wealthradar-story-history-${{ runner.os }}-v1-
      - name: Report restored story history
        if: (github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))
        run: |
          if [ -s output/history/used_stories.json ]; then
            count=$(python -c "import json; print(len(json.load(open('output/history/used_stories.json', encoding='utf-8')).get('stories', [])))")
          else
            count=0
          fi
          echo "[STORY_HISTORY_RESTORED] records=$count cooldown_hours=8"
      - name: Render actual Pexels B-roll previews (when the API key is configured)
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "[BROLL_PREVIEW_SKIPPED] PEXELS_API_KEY is not configured; mocked renderer tests still run."
          else
            python scripts/render_broll_preview.py
          fi
      - name: Restore resumable scene cache
        if: github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            output/bulletin/.render_cache
            output/bulletin/shorts/.render_cache
          key: wealthradar-scenes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wealthradar-scenes-${{ runner.os }}-
      - name: Report restored scene cache
        if: github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true
        run: |
          count=$(find output/bulletin/.render_cache output/bulletin/shorts/.render_cache -type f -name manifest.json 2>/dev/null | wc -l)
          echo "[RENDER_CACHE_RESTORE] manifests=$count"
      - name: Restore reusable licensed B-roll downloads
        if: (github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)
        uses: actions/cache/restore@v6.1.0
        with:
          path: output/broll-cache
          key: wealthradar-broll-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wealthradar-broll-${{ runner.os }}-
      - name: Report B-roll cache
        if: (github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)
        run: |
          count=$(find output/broll-cache -type f -name '*.mp4' 2>/dev/null | wc -l)
          echo "[BROLL_CACHE_RESTORED] clips=$count"
      - name: Run NewsFlow
        if: success() && ((github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')))
        env:
          NEWSFLOW_MAX_STORIES: "4"
          NEWSFLOW_BROLL_CACHE_DIR: output/broll-cache
          NEWSFLOW_FACT_CHECK_ENABLED: "true"
          NEWSFLOW_FACT_CHECK_MODEL: gpt-6-astra
          OPENAI_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.OPENAI_API_KEY || '' }}
          NEWSFLOW_LOOKBACK_HOURS: ${{ steps.cairo_schedule.outputs.lookback_hours || '72' }}
          NEWSFLOW_DEDUPE_HISTORY_ENABLED: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && 'true' || 'false' }}
          NEWSFLOW_RECORD_DRAFT_HISTORY: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && 'true' || 'false' }}
          NEWSFLOW_HISTORY_FILE: output/history/used_stories.json
          NEWSFLOW_STRICT_FRESHNESS: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && 'true' || 'false' }}
          FISH_AUDIO_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.FISH_AUDIO_API_KEY || '' }}
          FISH_AUDIO_REFERENCE_ID: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.FISH_AUDIO_REFERENCE_ID || '' }}
          FISH_AUDIO_MODEL: s2.1-pro-free
          PEXELS_API_KEY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && secrets.PEXELS_API_KEY || '' }}
          NEWSFLOW_MAIN_VIDEO_PORTRAIT: "false"
          NEWSFLOW_UPLOAD_SINGLE_LONG: "false"
          NEWSFLOW_VISUAL_QA_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.visual_qa_approved && 'true' || 'false' }}
          # Schedule and the one-time [private-stage] push may upload PRIVATE review drafts only.
          NEWSFLOW_PRIVATE_STAGING: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && 'true' || 'false' }}
          NEWSFLOW_EDITORIAL_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && 'true' || 'false' }}
          YOUTUBE_UPLOAD_ENABLED: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && 'true' || 'false' }}
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_CLIENT_ID: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.YOUTUBE_CLIENT_ID || '' }}
          YOUTUBE_CLIENT_SECRET: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.YOUTUBE_CLIENT_SECRET || '' }}
          YOUTUBE_REFRESH_TOKEN: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true)) && secrets.YOUTUBE_REFRESH_TOKEN || '' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(github.event.head_commit.message, '[private-stage]') }}" = "true" ]; }; then
            echo "[PRIVATE_REVIEW_UPLOAD] Producing and uploading long + Shorts as PRIVATE only."
            python -m newsflow --private-staging
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.private_test }}" = "true" ] \
             && [ "${{ inputs.editorial_approved }}" = "true" ] \
             && [ "${{ inputs.visual_qa_approved }}" = "true" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m newsflow --private-test
          else
            python -m newsflow --dry-run
          fi
      - name: Save reusable licensed B-roll downloads
        if: always() && ((github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true))
        uses: actions/cache/save@v6.1.0
        with:
          path: output/broll-cache
          key: wealthradar-broll-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save recent scheduled story history
        if: success() && ((github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]'))) && hashFiles('output/history/used_stories.json') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: output/history
          key: wealthradar-story-history-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save resumable scene cache
        if: always() && github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            output/bulletin/.render_cache
            output/bulletin/shorts/.render_cache
          key: wealthradar-scenes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Capture actual rendered video frames for phone QA
        if: always() && ((github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')) || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && inputs.dry_run != true))
        run: |
          qa_count=0
          if [ -s output/bulletin/long.mp4 ]; then
            python scripts/capture_video_qa.py --video output/bulletin/long.mp4 --output output/mobile-qa/long
            qa_count=$((qa_count + 1))
          else
            echo "[ACTUAL_VIDEO_QA_SKIPPED] no long.mp4 was produced"
          fi
          for short in output/bulletin/shorts/short-*.mp4; do
            [ -s "$short" ] || continue
            short_name=$(basename "$short" .mp4)
            python scripts/capture_video_qa.py --video "$short" --output "output/mobile-qa/$short_name"
            qa_count=$((qa_count + 1))
          done
          echo "[PHONE_QA_COMPLETE] videos=$qa_count (main + available Shorts)"
      - name: Upload generated files
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.cairo_schedule.outputs.run == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private-stage]')))
        uses: actions/upload-artifact@v7.0.2
        with:
          name: newsflow-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
