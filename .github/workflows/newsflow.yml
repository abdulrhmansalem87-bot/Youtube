name: NewsFlow pipeline

on:
  push:
    branches: [main]
    paths:
      - "newsflow/**"
      - "config/sources.yml"
      - ".github/workflows/newsflow.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect news and render the WealthRadar video package"
        required: false
        type: boolean
        default: false
      private_test:
        description: "Upload one long video as PRIVATE (manual run only)"
        required: false
        type: boolean
        default: false
      editorial_approved:
        description: "I reviewed the generated editorial report and approve private upload"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: newsflow-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q newsflow
      - name: Run NewsFlow
        env:
          NEWSFLOW_MAX_STORIES: "8"
          NEWSFLOW_TTS_VOICE: ar-EG-ShakirNeural
          NEWSFLOW_EDITORIAL_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.editorial_approved && 'true' || 'false' }}
          YOUTUBE_UPLOAD_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.editorial_approved && 'true' || 'false' }}
          YOUTUBE_UPLOAD_SINGLE_LONG: "false"
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m newsflow
          elif [ "${{ inputs.private_test }}" = "true" ]; then
            python -m newsflow --private-test
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m newsflow --dry-run
          else
            python -m newsflow
          fi
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsflow-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
