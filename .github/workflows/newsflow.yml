name: NewsFlow pipeline

on:
  push:
    branches: [main]
    paths:
      - "newsflow/**"
      - "config/sources.yml"
      - ".github/workflows/newsflow.yml"
      - "tests/**"
      - "content/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "newsflow/**"
      - "config/sources.yml"
      - ".github/workflows/newsflow.yml"
      - "tests/**"
      - "content/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and validate stories only; disable only for an explicitly approved private test"
        required: false
        type: boolean
        default: true
      private_test:
        description: "Upload one long video as PRIVATE (manual run only)"
        required: false
        type: boolean
        default: false
      editorial_approved:
        description: "I reviewed the generated editorial report and approve private upload"
        required: false
        type: boolean
        default: false
      visual_qa_approved:
        description: "I reviewed the actual phone preview from a prior run and approve a PRIVATE test only"
        required: false
        type: boolean
        default: false
  schedule:
    # Cairo (UTC+2 in winter): 3 PM, 7 PM, 10 PM
    - cron: "0 13,17,20 * * *"

permissions:
  contents: read

concurrency:
  # PR preview renders must not queue behind or delay the daily production run.
  group: ${{ github.event_name == 'pull_request' && format('newsflow-pr-{0}-{1}', github.event.pull_request.number, github.sha) || 'newsflow-production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q newsflow
      - name: Run editorial and render tests
        run: python -m unittest discover -s tests -v
      - name: Render actual Pexels B-roll previews (landscape and portrait)
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/render_broll_preview.py
      - name: Restore resumable scene cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            output/bulletin/.render_cache
            output/bulletin/shorts/.render_cache
            output/history
          key: wealthradar-scenes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wealthradar-scenes-${{ runner.os }}-
      - name: Report restored scene cache
        if: github.event_name != 'pull_request'
        run: |
          count=$(find output/bulletin/.render_cache output/bulletin/shorts/.render_cache -type f -name manifest.json 2>/dev/null | wc -l)
          echo "[RENDER_CACHE_RESTORE] manifests=$count"
      - name: Run NewsFlow
        # Never render after failed tests; PR runs remain upload-disabled review renders.
        if: success()
        timeout-minutes: 25
        env:
          # Keep PR validation focused: one complete story is enough to verify the renderer.
          NEWSFLOW_MAX_STORIES: ${{ github.event_name == 'pull_request' && '1' || '4' }}
          # Give the editorial selector a full day of eligible financial coverage.
          NEWSFLOW_LOOKBACK_HOURS: "24"
          NEWSFLOW_STRICT_FRESHNESS: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-private]'))) && 'true' || 'false' }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ secrets.FISH_AUDIO_REFERENCE_ID }}
          FISH_AUDIO_MODEL: s2.1-pro-free
          # Licensed moving footage is mandatory for NewsFlow; no static-card fallback.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEWSFLOW_MAIN_VIDEO_PORTRAIT: "false"
          # Keep story-specific Shorts enabled on every scheduled run.
          NEWSFLOW_UPLOAD_SINGLE_LONG: "false"
          NEWSFLOW_VISUAL_QA_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_qa_approved && 'true' || 'false' }}
          # Scheduled runs render and stage validated videos as PRIVATE for owner review.
          NEWSFLOW_PRIVATE_STAGING: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-private]'))) && 'true' || 'false' }}
          NEWSFLOW_PRIVATE_STAGE_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-private]') && 'true' || 'false' }}
          NEWSFLOW_EDITORIAL_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && 'true' || 'false' }}
          # Scheduled uploads are PRIVATE staging only; manual test uploads retain explicit approvals.
          YOUTUBE_UPLOAD_ENABLED: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-private]'))) && 'true' || (github.event_name == 'workflow_dispatch' && inputs.private_test && inputs.editorial_approved && inputs.visual_qa_approved && 'true') || 'false' }}
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$NEWSFLOW_PRIVATE_STAGE_PUSH" = "true" ]; then
            python -m newsflow --private-staging
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.private_test }}" = "true" ] \
             && [ "${{ inputs.editorial_approved }}" = "true" ] \
             && [ "${{ inputs.visual_qa_approved }}" = "true" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m newsflow --private-test
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m newsflow --render-only
          else
            python -m newsflow --dry-run
          fi
      - name: Save resumable scene cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            output/bulletin/.render_cache
            output/bulletin/shorts/.render_cache
            output/history
          key: wealthradar-scenes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Capture actual rendered video frames for phone QA
        if: always()
        run: |
          qa_count=0
          if [ -s output/bulletin/long.mp4 ]; then
            python scripts/capture_video_qa.py --video output/bulletin/long.mp4 --output output/mobile-qa/long
            qa_count=$((qa_count + 1))
          else
            echo "[ACTUAL_VIDEO_QA_SKIPPED] no long.mp4 was produced"
          fi
          for short in output/bulletin/shorts/short-*.mp4; do
            [ -s "$short" ] || continue
            short_name=$(basename "$short" .mp4)
            python scripts/capture_video_qa.py --video "$short" --output "output/mobile-qa/$short_name"
            qa_count=$((qa_count + 1))
          done
          echo "[PHONE_QA_COMPLETE] videos=$qa_count (main + available Shorts)"
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsflow-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
