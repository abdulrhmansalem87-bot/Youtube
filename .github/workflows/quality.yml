name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Compile Python and QA scripts
        run: python -m compileall -q newsflow scripts
      - name: Validate source configuration
        run: python -c "import yaml; yaml.safe_load(open('config/sources.yml', encoding='utf-8'))"
      - name: Test WealthRadar Shorts validation
        run: python -m unittest discover -s tests -v
      - name: Validate example WealthRadar production plan
        run: python -m wealthradar_shorts --plan wealthradar/production.example.json --validate-only
