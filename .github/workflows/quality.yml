name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q newsflow
      - name: Validate source configuration
        run: python -c "import yaml; yaml.safe_load(open('config/sources.yml', encoding='utf-8'))"
